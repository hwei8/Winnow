name: 功能建议
description: 提出一个改进或新能力
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 描述场景，而不是先给方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法
  - type: dropdown
    id: area
    attributes:
      label: 相关模块
      options: [ingest, knowledge, story, memory, brief, web, cli, providers, docs]
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 为什么不用
