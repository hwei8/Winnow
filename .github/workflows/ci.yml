name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.13 是 node:sqlite 无需 --experimental-sqlite 的最低版本（见 package.json engines）
        node: ['22.13.0', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Static check (syntax, imports, script paths)
        run: npm run check
      - name: Unit & integration tests
        run: npm test
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
